name: Build ingest image

# Builds and publishes the demo-form ingest shim image to GHCR.
# The k8s manifests in canopy-k8s-configs pin an immutable tag from here.
on:
  push:
    branches: [main]
    paths:
      - 'ingest/**'
      - '.github/workflows/ingest-image.yml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/canopy-ag/canopy-website-ingest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          STAMP="$(date -u +%Y%m%d%H%M%S)"
          echo "immutable=${IMAGE}:main-${SHORT_SHA}-${STAMP}" >> "$GITHUB_OUTPUT"
          echo "latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./ingest
          push: true
          tags: |
            ${{ steps.tags.outputs.immutable }}
            ${{ steps.tags.outputs.latest }}

      - name: Summary
        run: |
          echo "Published: ${{ steps.tags.outputs.immutable }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this tag in canopy-k8s-configs/canopy-tools/canopy-website-ingest/deployment.yaml" >> "$GITHUB_STEP_SUMMARY"
